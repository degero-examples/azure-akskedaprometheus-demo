# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: aks-keda-demo
metadata:
  template: aks-keda-demo@0.0.1
workflows:
  up: 
    steps:
      - azd: provision
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: azd-hooks/preprovision.ps1
      continueOnError: false
      interactive: true
    posix:
      shell: sh
      run: chmod +x azd-hooks/preprovision.sh && azd-hooks/preprovision.sh
      continueOnError: false
      interactive: true
  postprovision:
    windows:
      shell: pwsh
      run: azd-hooks/postprovision.ps1
      continueOnError: false
      interactive: true
    posix:
      shell: sh
      run: chmod +x azd-hooks/postprovision.sh && azd-hooks/postprovision.sh
      continueOnError: false
      interactive: true
infra:
  provider: bicep
  path: infra
  module: main-azd